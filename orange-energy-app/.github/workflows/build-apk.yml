name: Build Android APK

on:
  push:
    branches:
      - main # Change to your branch name if different (e.g., master)
  workflow_dispatch: # Allows manual trigger from GitHub web UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd orange-energy-app
          npm install --legacy-peer-deps

      - name: Build Web Assets
        run: |
          cd orange-energy-app
          npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Capacitor
        run: |
          cd orange-energy-app
          npx cap sync android

      - name: Build Android APK
        run: |
          cd orange-energy-app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: orange-energy-app/android/app/build/outputs/apk/debug/app-debug.apk