name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install System Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OrangeEnergyContract-APK
        path: app/build/outputs/apk/debug/*.apk

    - name: Generate Direct QR Code & Link
      run: |
        ARTIFACT_URL="https://nightly.link/${{ github.repository }}/workflows/android/main/OrangeEnergyContract-APK.zip"
        echo "### 📱 Quick APK Download Link" >> $GITHUB_STEP_SUMMARY
        echo "[Click here to download APK]($ARTIFACT_URL)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📷 Scan to Install on Device" >> $GITHUB_STEP_SUMMARY
        echo "![Scan QR Code](https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=$ARTIFACT_URL)" >> $GITHUB_STEP_SUMMARY